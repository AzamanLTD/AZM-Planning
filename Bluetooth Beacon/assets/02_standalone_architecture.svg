<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#123553"/></linearGradient><linearGradient id="a" x2="1"><stop stop-color="#25c7dd"/><stop offset="1" stop-color="#427fff"/></linearGradient></defs><rect width="1280" height="720" rx="32" fill="url(#b)"/><text x="68" y="78" fill="#73e4ed" font-family="Arial" font-size="21" font-weight="700" letter-spacing="4">DEPLOYMENT ARCHITECTURE</text><text x="68" y="136" fill="#fff" font-family="Arial" font-size="47" font-weight="700">No merchant network hardware required</text><text x="68" y="179" fill="#b7c9dc" font-family="Arial" font-size="22">The phone is the bridge between local radio detection and Azaman services.</text><g><rect x="68" y="272" width="250" height="228" rx="22" fill="#183c5a" stroke="#56c6d8"/><path d="M153 350h80m-40-40v80" stroke="#7ce6ef" stroke-width="9" stroke-linecap="round"/><path d="M128 349q-38 40 0 80m130-80q38 40 0 80" stroke="#53ccde" fill="none" stroke-width="4"/><text x="193" y="440" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">BLE BEACON</text><text x="193" y="472" text-anchor="middle" fill="#c1d6e8" font-family="Arial" font-size="17">Broadcast only</text></g><g><rect x="390" y="272" width="250" height="228" rx="22" fill="#183c5a" stroke="#56c6d8"/><rect x="484" y="305" width="62" height="112" rx="12" fill="#08182a" stroke="#71dcea" stroke-width="4"/><rect x="492" y="316" width="46" height="85" rx="5" fill="#dcecf4"/><circle cx="515" cy="408" r="4" fill="#78dce9"/><text x="515" y="440" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">CUSTOMER PHONE</text><text x="515" y="472" text-anchor="middle" fill="#c1d6e8" font-family="Arial" font-size="17">BLE + own internet</text></g><g><rect x="712" y="272" width="250" height="228" rx="22" fill="#183c5a" stroke="#3c83f5"/><path d="M785 355h104M837 303v104" stroke="#6ce0ee" stroke-width="8" stroke-linecap="round"/><circle cx="837" cy="355" r="47" fill="none" stroke="#3e91d7" stroke-width="3"/><text x="837" y="440" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">AZAMAN API</text><text x="837" y="472" text-anchor="middle" fill="#c1d6e8" font-family="Arial" font-size="17">Auth + resolution</text></g><g><rect x="1034" y="272" width="178" height="228" rx="22" fill="#183c5a" stroke="#3c83f5"/><ellipse cx="1123" cy="332" rx="48" ry="17" fill="#4d9bd0"/><path d="M1075 332v70c0 22 96 22 96 0v-70M1075 367c0 22 96 22 96 0" fill="none" stroke="#6fd6e4" stroke-width="4"/><text x="1123" y="440" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">POSTGRES</text><text x="1123" y="472" text-anchor="middle" fill="#c1d6e8" font-family="Arial" font-size="17">Registry + audit</text></g><g fill="none" stroke="url(#a)" stroke-width="5"><path d="M318 386h65M640 386h65M962 386h65"/></g><g fill="#77e7ef"><path d="M371 374l16 12-16 12z"/><path d="M693 374l16 12-16 12z"/><path d="M1015 374l16 12-16 12z"/></g><rect x="70" y="560" width="1140" height="88" rx="18" fill="#0b2139" stroke="#2a5276"/><text x="100" y="596" fill="#7ce6ef" font-family="Arial" font-size="20" font-weight="700">MERCHANT NETWORK</text><text x="100" y="626" fill="#d4e2ef" font-family="Arial" font-size="21">No shop Wi-Fi • No Ethernet • No gateway • No beacon SIM for basic discovery</text><text x="1210" y="684" text-anchor="end" fill="#9eb7cc" font-family="Arial" font-size="15">The customer’s phone supplies internet connectivity.</text></svg>