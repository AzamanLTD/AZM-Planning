<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#163550"/></linearGradient></defs><rect width="1280" height="720" rx="32" fill="url(#b)"/><text x="68" y="78" fill="#78e3ed" font-family="Arial" font-size="21" font-weight="700" letter-spacing="4">FUEL — SEPARATE SAFETY-GATED PILOT</text><text x="68" y="137" fill="#fff" font-family="Arial" font-size="47" font-weight="700">Station context is not pump selection</text><text x="68" y="179" fill="#b8cadc" font-family="Arial" font-size="22">Customer confirms pump, grade and amount. POS/attendant verifies payment before dispense.</text><g font-family="Arial"><rect x="60" y="255" width="175" height="200" rx="18" fill="#173b59" stroke="#58c8d8"/><circle cx="147" cy="314" r="35" fill="#285b76"/><path d="M131 335h32m-25-43h18v43m-11-43v-12h9v12" stroke="#8be5ec" fill="none" stroke-width="4"/><text x="147" y="390" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">1. STATION</text><text x="147" y="420" text-anchor="middle" fill="#c4d8e7" font-size="16">Beacon resolves</text><rect x="273" y="255" width="175" height="200" rx="18" fill="#173b59" stroke="#58c8d8"/><rect x="327" y="287" width="66" height="92" rx="12" fill="#081b2e" stroke="#80e1eb" stroke-width="3"/><rect x="336" y="298" width="48" height="61" rx="5" fill="#deeff7"/><text x="360" y="390" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">2. PUMP</text><text x="360" y="420" text-anchor="middle" fill="#c4d8e7" font-size="16">Customer selects</text><rect x="486" y="255" width="175" height="200" rx="18" fill="#173b59" stroke="#58c8d8"/><rect x="526" y="294" width="95" height="75" rx="10" fill="#0c243b" stroke="#6fd9e5"/><path d="M543 317h60m-60 19h45" stroke="#9cdde7" stroke-width="5" stroke-linecap="round"/><text x="573" y="390" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">3. GRADE</text><text x="573" y="420" text-anchor="middle" fill="#c4d8e7" font-size="16">Fuel + amount</text><rect x="699" y="255" width="175" height="200" rx="18" fill="#173b59" stroke="#3d82f4"/><circle cx="786" cy="322" r="37" fill="none" stroke="#6ab5f5" stroke-width="6"/><path d="M766 322h40m-20-20v40" stroke="#6ab5f5" stroke-width="5"/><text x="786" y="390" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">4. PAYMENT</text><text x="786" y="420" text-anchor="middle" fill="#c4d8e7" font-size="16">Authorised source</text><rect x="912" y="255" width="175" height="200" rx="18" fill="#173b59" stroke="#3d82f4"/><path d="M958 298h82v70h-82z" fill="#0b2138" stroke="#79dce8" stroke-width="3"/><path d="M969 316h60m-60 15h44" stroke="#8edfe8" stroke-width="4"/><text x="999" y="390" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">5. VERIFY</text><text x="999" y="420" text-anchor="middle" fill="#c4d8e7" font-size="16">POS / attendant</text><rect x="1125" y="255" width="125" height="200" rx="18" fill="#173b59" stroke="#3d82f4"/><path d="M1165 298h43v72h-43z" fill="#12334c" stroke="#83e3ec" stroke-width="3"/><path d="M1174 313h25m-25 15h25" stroke="#83e3ec" stroke-width="4"/><text x="1187" y="390" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">6. DISPENSE</text><text x="1187" y="420" text-anchor="middle" fill="#c4d8e7" font-size="15">Reconcile</text></g><g stroke="#65dce6" stroke-width="4" fill="none"><path d="M235 354h32M448 354h32M661 354h32M874 354h32M1087 354h30"/></g><g fill="#65dce6"><path d="M258 344l14 10-14 10z"/><path d="M471 344l14 10-14 10z"/><path d="M684 344l14 10-14 10z"/><path d="M897 344l14 10-14 10z"/><path d="M1108 344l14 10-14 10z"/></g><rect x="60" y="510" width="1160" height="120" rx="18" fill="#2b2630" stroke="#c58c4b" stroke-width="2"/><text x="90" y="552" fill="#ffc981" font-family="Arial" font-size="22" font-weight="700">GO / NO-GO SAFETY GATE</text><text x="90" y="590" fill="#f5e9d9" font-family="Arial" font-size="19">Written OMC/site approval • Exact installation location • Phone-use permission • Hazardous-area suitability • NCA status</text><text x="90" y="615" fill="#f5e9d9" font-family="Arial" font-size="16">IP67 alone is not intrinsically safe. Beacon detection never authorises payment or proves dispensing.</text></svg>