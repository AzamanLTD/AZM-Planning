<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07182c"/><stop offset="1" stop-color="#133755"/></linearGradient></defs><rect width="1280" height="720" rx="32" fill="url(#b)"/><text x="70" y="78" fill="#78e3ed" font-family="Arial" font-size="21" font-weight="700" letter-spacing="4">OPERATIONS &amp; VERIFICATION</text><text x="70" y="137" fill="#fff" font-family="Arial" font-size="47" font-weight="700">Two evidence streams. One admin view.</text><text x="70" y="179" fill="#b8cadc" font-family="Arial" font-size="22">Worker tests are not customer visits. A customer observation is not a continuous heartbeat.</text><g><rect x="70" y="245" width="500" height="340" rx="24" fill="#173a58" stroke="#50bfd5"/><circle cx="180" cy="360" r="48" fill="#214e6a"/><path d="M154 372q26-40 52 0m-44-34a18 18 0 1 0 36 0" fill="none" stroke="#8ce5ed" stroke-width="6" stroke-linecap="round"/><text x="260" y="332" fill="#7de5ed" font-family="Arial" font-size="19" font-weight="700">WORKER-INITIATED</text><text x="260" y="370" fill="#fff" font-family="Arial" font-size="31" font-weight="700">Test Presence</text><text x="260" y="405" fill="#c1d4e5" font-family="Arial" font-size="18">Assigned branch + expected beacon</text><rect x="120" y="455" width="400" height="74" rx="14" fill="#0c273e"/><circle cx="160" cy="492" r="15" fill="#2dd19b"/><path d="M152 492l6 6 11-14" stroke="#082a2b" stroke-width="4" fill="none"/><text x="195" y="500" fill="#fff" font-family="Arial" font-size="22" font-weight="700">WORKER_TEST_PASSED</text><text x="320" y="558" text-anchor="middle" fill="#c1d4e5" font-family="Arial" font-size="16">Does not create a visit, notification or payment</text></g><g><rect x="710" y="245" width="500" height="340" rx="24" fill="#173a58" stroke="#397ef2"/><circle cx="820" cy="360" r="48" fill="#214e6a"/><rect x="797" y="331" width="46" height="60" rx="9" fill="#0b1d30" stroke="#73dce8" stroke-width="3"/><rect x="804" y="339" width="32" height="41" rx="4" fill="#d8eef5"/><text x="900" y="332" fill="#8bb8ff" font-family="Arial" font-size="19" font-weight="700">CUSTOMER-OBSERVED</text><text x="900" y="370" fill="#fff" font-family="Arial" font-size="31" font-weight="700">Presence event</text><text x="900" y="405" fill="#c1d4e5" font-family="Arial" font-size="18">Opted-in app detects a broadcast</text><rect x="760" y="455" width="400" height="74" rx="14" fill="#0c273e"/><circle cx="800" cy="492" r="15" fill="#67b6f5"/><path d="M793 492h14m-7-7v14" stroke="#06233f" stroke-width="3"/><text x="835" y="500" fill="#fff" font-family="Arial" font-size="22" font-weight="700">BEACON_OBSERVED</text><text x="960" y="558" text-anchor="middle" fill="#c1d4e5" font-family="Arial" font-size="16">Momentary evidence, not a continuous heartbeat</text></g><path d="M570 415h120" stroke="#5bd9e6" stroke-width="5"/><path d="M674 402l18 13-18 13z" fill="#5bd9e6"/><g><rect x="480" y="615" width="320" height="62" rx="16" fill="#edf5fa"/><text x="640" y="653" text-anchor="middle" fill="#173a58" font-family="Arial" font-size="23" font-weight="700">ADMIN DEVICE RECORD</text></g></svg>